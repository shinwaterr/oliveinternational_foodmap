<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7aa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>올리브인터내셔널 맛지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen mobile app — three tabs (지도 / 오늘 뭐 먹지 / 랜덤 런치밋) behind one floating pill bar */
:root{
  --sky:#cfe6ff; --sky2:#e9f4ff;
  --ground:#f4f7fb; --block:#ffffff; --park:#c9efd3; --road:#ffffff; --roadEdge:#dce6f2;
  --ink:#24324a; --ink2:#6a7a93; --line:#e3eaf3;
  --card:#ffffffee; --cardSolid:#ffffff;
  --accent:#3d7bff; --accentSoft:#e3edff;
  --pink:#ff7aa8; --pinkSoft:#ffe4ee; --mint:#3cc47c; --mintSoft:#dcf6e8; --sun:#ffc531; --sunSoft:#fff3cf;
  --shadow:0 10px 30px rgba(52,94,160,.18);
  --route:#1fb85f; --routeDeep:#15904a; --routeSoft:#dbf7e6;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#1b2a44; --sky2:#14203a; --ground:#1d2940; --block:#26344f; --park:#24493a; --road:#33435f; --roadEdge:#2a3954;
  --ink:#eef3ff; --ink2:#a5b3cc; --line:#34445f; --card:#22304aee; --cardSolid:#22304a;
  --accent:#7aa5ff; --accentSoft:#2c3d63; --pink:#ff8fb7; --pinkSoft:#4a2c40; --mint:#5ad69a; --mintSoft:#1f4434; --sun:#ffd25c; --sunSoft:#4a3f1f;
  --shadow:0 10px 30px rgba(0,0,0,.4); --route:#3ed683; --routeDeep:#24a85f; --routeSoft:#1c4532; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#1b2a44; --sky2:#14203a; --ground:#1d2940; --block:#26344f; --park:#24493a; --road:#33435f; --roadEdge:#2a3954;
  --ink:#eef3ff; --ink2:#a5b3cc; --line:#34445f; --card:#22304aee; --cardSolid:#22304a;
  --accent:#7aa5ff; --accentSoft:#2c3d63; --pink:#ff8fb7; --pinkSoft:#4a2c40; --mint:#5ad69a; --mintSoft:#1f4434; --sun:#ffd25c; --sunSoft:#4a3f1f;
  --shadow:0 10px 30px rgba(0,0,0,.4); --route:#3ed683; --routeDeep:#24a85f; --routeSoft:#1c4532; color-scheme:dark}
html,body{height:100%}
body{background:var(--sky2);color:var(--ink);font-family:var(--body);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;overflow:hidden;background:var(--ground);box-shadow:0 0 0 1px var(--line)}

/* ===== map ===== */
#map{position:absolute;inset:0;touch-action:none;cursor:grab;background:radial-gradient(1200px 600px at 50% -10%,var(--sky),transparent 60%),var(--ground)}
#map.drag{cursor:grabbing}
#layer{position:absolute;left:0;top:0;transform-origin:0 0}
#roads{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.pin{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:0}
.bub{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--cardSolid);
  box-shadow:0 4px 0 var(--c,#ccc),0 8px 14px rgba(40,70,120,.22);border:3px solid var(--c,#ccc);transition:transform .18s}
.pin:hover .bub,.pin.on .bub{transform:translateY(-4px) scale(1.12)}
.pin.on{z-index:20}
.tag{font-family:var(--display);font-size:11.5px;background:var(--card);padding:2px 7px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 6px rgba(40,70,120,.15);max-width:110px;overflow:hidden;text-overflow:ellipsis}
.hideTags .pin:not(.on) .tag{display:none}
.pin.dim{opacity:.18;pointer-events:none}
.pin.hide{display:none}
.hq{position:absolute;z-index:15;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0}
.hq .ring{position:absolute;left:50%;bottom:-6px;width:140px;height:46px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--pink) 35%,transparent),transparent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.25);opacity:.5}}
.hq .label{font-family:var(--display);font-size:14px;background:var(--pink);color:#fff;padding:4px 12px;border-radius:99px;box-shadow:0 4px 0 #e05c8b;margin-bottom:4px;white-space:nowrap}
.station{position:absolute;font-family:var(--display);font-size:13px;background:#3cb371;color:#fff;padding:3px 10px;border-radius:99px;box-shadow:0 3px 0 #2a8a55;white-space:nowrap;pointer-events:none}
#routeSvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#routeSvg .rcase{fill:none;stroke:var(--cardSolid);stroke-linecap:round;stroke-linejoin:round}
#routeSvg .rline{fill:none;stroke:var(--route);stroke-linecap:round;stroke-linejoin:round}
#routeSvg .rflow{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;opacity:.85;animation:flow 1s linear infinite}
#routeSvg .rguess{stroke-dasharray:var(--dash)}
@keyframes flow{to{stroke-dashoffset:calc(var(--gap) * -1)}}
.routeBar{position:absolute;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:31;background:var(--cardSolid);border-radius:24px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border:2px solid var(--route)}
.rb1{display:flex;align-items:center;gap:10px}
.rb1 .ic{width:40px;height:40px;border-radius:14px;background:var(--routeSoft);display:grid;place-items:center;font-size:21px;flex:none}
.rb1 .tt{font-family:var(--display);font-size:16px;line-height:1.25;min-width:0}
.rb1 .tt small{display:block;font-family:var(--body);font-size:12px;color:var(--ink2)}
.rb1 .x{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--ground);font-size:15px}
.rb2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rb2 .big{font-family:var(--display);font-size:22px;color:var(--route);font-variant-numeric:tabular-nums}
.rb2 .sub{font-size:12.5px;color:var(--ink2)}
.rbMaps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rbMaps a{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:99px;font-family:var(--display);font-size:13.5px;text-decoration:none;white-space:nowrap}
.rbMaps .mk{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:12px;line-height:1;font-family:Arial,sans-serif;font-weight:700}
.rbMaps .kakao{color:#3a2a00;background:#fee500}.rbMaps .kakao .mk{background:#3a2a00;color:#fee500}
.rbMaps .place{color:#fff;background:var(--pink);box-shadow:0 3px 0 #e05c8b}
.rnote{font-size:11.5px;color:var(--ink2);line-height:1.45}
.exitMark{position:absolute;display:flex;align-items:center;gap:3px;padding:2px 7px 2px 2px;border-radius:99px;background:#3cb371;color:#fff;font-family:var(--display);font-size:11.5px;line-height:1;white-space:nowrap;box-shadow:0 2px 0 #2a8a55,0 4px 8px rgba(40,70,120,.18);pointer-events:none;z-index:5}
.exitMark b{display:grid;place-items:center;min-width:19px;height:19px;border-radius:50%;background:#fff;color:#2a8a55;font-weight:400;font-size:12px;padding:0 3px}
.exitMark.hq8{background:var(--pink);box-shadow:0 2px 0 #e05c8b,0 4px 8px rgba(40,70,120,.18)}
.exitMark.hq8 b{color:#e05c8b}
.roadname{font-family:var(--display);fill:var(--ink2);opacity:.8}

/* ===== shared chrome ===== */
.top{position:absolute;left:0;right:0;top:0;z-index:30;background:linear-gradient(var(--ground) 0,var(--ground) 72%,transparent);padding-bottom:12px!important;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.hdr{display:flex;align-items:center;gap:10px}
.title{font-family:var(--display);font-size:clamp(19px,5.6vw,25px);line-height:1.1;min-width:0;letter-spacing:-.5px;text-shadow:0 2px 0 var(--card)}
.title small{display:block;font-family:var(--body);font-size:11.5px;color:var(--ink2);letter-spacing:0;margin-top:4px}
.sp{flex:1}
.round{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;backdrop-filter:blur(8px)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:0 14px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.search input{flex:1;border:0;background:none;font-size:14.5px;padding:12px 0;min-width:0}
.search input::placeholder{color:var(--ink2)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 6px;margin:0 -14px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;border:0;border-radius:99px;padding:7px 12px 7px 9px;background:var(--card);box-shadow:0 4px 12px rgba(52,94,160,.14);font-family:var(--display);font-size:13.5px;display:flex;align-items:center;gap:5px;backdrop-filter:blur(8px)}
.chip .e{font-size:16px}
.chip .n{font-family:var(--body);font-size:11px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--chipOn,var(--ink));color:#fff}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.fab{position:absolute;right:max(14px,env(safe-area-inset-right,0px));z-index:25;display:flex;flex-direction:column;gap:8px}

/* bottom: cards + pill bar */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.sheet>*{pointer-events:auto}
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px max(14px,env(safe-area-inset-left,0px)) 12px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.carousel{position:relative;container-type:inline-size;--cw:min(320px,84cqw)}
.cards:not(.solo){padding-left:calc((100cqw - var(--cw)) / 2);padding-right:calc((100cqw - var(--cw)) / 2)}
.cards:not(.solo) .card{width:var(--cw)}
.cnav{display:flex;align-items:center;justify-content:center;gap:12px;padding:0 0 10px}
.arrow{width:44px;height:44px;border-radius:50%;border:0;background:var(--cardSolid);box-shadow:0 5px 14px rgba(52,94,160,.22);font-family:var(--display);font-size:20px;color:var(--ink);display:grid;place-items:center;transition:transform .15s,opacity .2s}
.arrow:active{transform:scale(.9)}
.arrow:disabled{opacity:.35;cursor:default}
.counter{min-width:76px;text-align:center;font-family:var(--display);font-size:14px;background:var(--card);border-radius:99px;padding:7px 12px;box-shadow:0 3px 10px rgba(52,94,160,.14);font-variant-numeric:tabular-nums;backdrop-filter:blur(8px)}
.counter small{font-family:var(--body);color:var(--ink2);font-size:12px}
.cards.solo{justify-content:center;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.cards.solo .card{margin:0 auto}
.card.hint{width:min(340px,92%);align-items:center;text-align:center;background:linear-gradient(150deg,var(--pinkSoft),var(--accentSoft))}
.card.hint .big{font-size:34px;line-height:1}
.card.hint .cname{font-size:18px}
.card.hint .desc{-webkit-line-clamp:3;min-height:0}
.card{flex:none;width:min(300px,80%);scroll-snap-align:center;background:var(--cardSolid);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);border:2px solid transparent;display:flex;flex-direction:column;gap:8px;text-align:left}
.card.on{border-color:var(--c)}
.crow{display:flex;gap:10px;align-items:center}
.cico{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:25px;background:var(--cbg)}
.cname{font-family:var(--display);font-size:17.5px;line-height:1.2;min-width:0}
.ccat{font-size:11.5px;color:var(--ink2)}
.menu{font-size:13px;background:var(--pinkSoft);border-radius:12px;padding:7px 10px;line-height:1.4}
.menu b{font-family:var(--display);font-weight:400;color:var(--pink);margin-right:4px}
.desc{font-size:12.5px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.exitTag{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-family:var(--display);font-size:12.5px;color:#fff;background:#3cb371;border-radius:99px;padding:4px 10px;line-height:1}
.exitTag .no{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:50%;background:#fff;color:#2a8a55;font-size:11.5px;padding:0 3px}
.exitTag small{font-family:var(--body);font-size:11.5px;opacity:.9}
.cfoot{display:grid;grid-template-columns:1fr;gap:8px}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2);margin-top:2px}
.cmeta .dot{opacity:.5}
.cmeta .ex{color:#2a8a55;font-family:var(--display)}
.walk{font-family:var(--display);font-size:13px;color:var(--accent);background:var(--accentSoft);border-radius:99px;padding:3px 9px;white-space:nowrap}
.cfoot .pill{display:flex;align-items:center;justify-content:center;gap:4px;height:36px;padding:0 6px;border:0;border-radius:99px;font-family:var(--display);font-size:13px;line-height:1;white-space:nowrap;text-decoration:none;min-width:0}
.cfoot .pill .pi{font-size:15px;width:16px;text-align:center;flex:none}
.cfoot .walkp{color:var(--accent);background:var(--accentSoft)}
.cfoot .nv{color:#fff;background:var(--pink);box-shadow:0 3px 0 #e05c8b}
.cfoot .route-btn{color:#fff;background:var(--route);box-shadow:0 3px 0 var(--routeDeep)}
.bar{display:flex;gap:6px;align-items:center;margin:0 max(14px,env(safe-area-inset-left,0px));background:var(--card);border-radius:999px;padding:6px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.bbtn{flex:1;border:0;background:none;border-radius:999px;padding:11px 4px;font-family:var(--display);font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:background .2s,color .2s}
.bbtn .i{font-size:17px}
.bbtn[aria-selected="true"]{background:linear-gradient(135deg,var(--pink),#ffa26b);color:#fff;box-shadow:0 4px 0 #e05c8b}
@media (max-width:360px){.bbtn{font-size:12.5px}.bbtn .i{font-size:15px}}

/* ===== panels (pick / meet) ===== */
.panel{position:absolute;inset:0;z-index:32;overflow-y:auto;background:radial-gradient(900px 420px at 50% -8%,var(--sky),transparent 65%),var(--ground);
  padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.ptitle{font-family:var(--display);font-size:27px;line-height:1.1;letter-spacing:-.5px}
.ptitle small{display:block;font-family:var(--body);font-size:12.5px;color:var(--ink2);letter-spacing:0;margin-top:6px;line-height:1.45}
.box{background:var(--cardSolid);border-radius:26px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.lbl{font-family:var(--display);font-size:14px;display:flex;align-items:center;gap:6px}
.lbl small{font-family:var(--body);font-size:11.5px;color:var(--ink2)}
.seg{display:flex;background:var(--ground);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:8px 4px;font-family:var(--display);font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--cardSolid);color:var(--ink);box-shadow:0 2px 8px rgba(52,94,160,.15)}
.box .chip{box-shadow:none;background:var(--ground);backdrop-filter:none}

/* slot machine */
.panel>*{flex-shrink:0}
.slot{position:relative;border-radius:30px;padding:22px 18px 18px;text-align:center;background:linear-gradient(160deg,var(--pinkSoft),var(--sunSoft));box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
.slot .face{width:110px;height:110px;border-radius:36px;background:var(--cardSolid);display:grid;place-items:center;font-size:62px;box-shadow:0 6px 0 var(--sc,var(--pink)),0 14px 24px rgba(40,70,120,.18);border:4px solid var(--sc,var(--pink))}
.slot.spin .face{animation:wob .14s linear infinite}
@keyframes wob{25%{transform:rotate(-6deg) translateY(-2px)}75%{transform:rotate(6deg) translateY(-2px)}}
.slot.done .face{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:none}}
.slot .sname{font-family:var(--display);font-size:26px;line-height:1.15;min-height:1.2em}
.slot .scat{font-size:12.5px;color:var(--ink2);min-height:1.2em}
.slot .menu{background:var(--cardSolid);max-width:100%}
.slot .desc{-webkit-line-clamp:3;min-height:0;text-align:center}
.slot .hint{font-size:13px;color:var(--ink2);line-height:1.5}
.spinBtn{border:0;border-radius:999px;padding:16px;font-family:var(--display);font-size:19px;color:#fff;background:linear-gradient(135deg,var(--pink),#ffa26b);box-shadow:0 5px 0 #e05c8b;width:100%}
.spinBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #e05c8b}
.spinBtn:disabled{opacity:.6}
.row2{display:flex;gap:8px;width:100%}
.ghost{flex:1;border:0;border-radius:18px;padding:12px;font-family:var(--display);font-size:14px;background:var(--cardSolid);color:var(--accent);box-shadow:0 3px 10px rgba(52,94,160,.12);text-decoration:none;text-align:center}
.ghost.nvg{color:#fff;background:#03c75a}
.cnt{font-size:12px;color:var(--ink2);text-align:center}

/* meet */
.hero{border-radius:30px;padding:18px;background:linear-gradient(150deg,var(--mintSoft),var(--accentSoft));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.hero .when{display:flex;align-items:center;gap:12px}
.cal{width:62px;flex:none;border-radius:18px;background:var(--cardSolid);text-align:center;overflow:hidden;box-shadow:0 4px 0 var(--mint)}
.cal .m{background:var(--mint);color:#fff;font-family:var(--display);font-size:12px;padding:3px 0}
.cal .d{font-family:var(--display);font-size:26px;line-height:1.3}
.cal .w{font-size:11px;color:var(--ink2);padding-bottom:4px}
.when .t{font-family:var(--display);font-size:19px;line-height:1.25}
.when .s{font-size:12.5px;color:var(--ink2);margin-top:3px}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--cardSolid);border-radius:18px;padding:9px 10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink2)}
.how{display:flex;gap:6px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.how span{background:var(--card);border-radius:99px;padding:4px 9px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{border:2px solid var(--line);background:var(--ground);border-radius:16px;padding:12px 14px;font-size:15px;min-width:0}
.field input:focus{border-color:var(--accent);outline:none}
.teams{display:flex;gap:6px;flex-wrap:wrap}
.teams button{border:0;border-radius:99px;padding:5px 10px;font-size:12.5px;background:var(--accentSoft);color:var(--accent);font-family:var(--display)}
.joinBtn{border:0;border-radius:999px;padding:15px;font-family:var(--display);font-size:18px;color:#fff;background:linear-gradient(135deg,var(--mint),#29b3a4);box-shadow:0 5px 0 #23966c}
.joinBtn:disabled{opacity:.55}
.joined{display:flex;align-items:center;gap:12px}
.joined .badge{width:52px;height:52px;border-radius:18px;background:var(--mintSoft);display:grid;place-items:center;font-size:28px;flex:none}

const pts=new Map(); let moved=0;

  if(pts.size===1){ view.tx+=e.clientX-p.x; view.ty+=e.clientY-p.y; moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); apply(); }
  else { const o=[...pts.entries()].find(([id])=>id!==e.pointerId)[1]; const d0=Math.hypot(p.x-o.x,p.y-o.y); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const d1=Math.hypot(e.clientX-o.x,e.clientY-o.y); const r=mapEl.getBoundingClientRect(); if(d0>0) zoomAt(d1/d0,(e.clientX+o.x)/2-r.left,(e.clientY+o.y)/2-r.top); moved+=99; } });

function clearRoute(){ routeId=null; routeSvg.innerHTML=''; $('#routeBar').hidden=true; if(state.tab==='map') $('#mapTop').hidden=false; }
function fitPoints(P){ fitRoute(P); }
function fitRoute(P){
  const r=mapEl.getBoundingClientRect(); const top=($('#routeBar').hidden?$('#mapTop').offsetHeight:$('#routeBar').offsetHeight)+30, bottom=$('.sheet').offsetHeight+30, side=50;
  const xs=P.map(p=>p.x), ys=P.map(p=>p.y); const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const s=Math.min(2.2,Math.max(0.45,Math.min((r.width-side*2)/Math.max(60,maxX-minX),(r.height-top-bottom)/Math.max(60,maxY-minY))));
  layer.style.transition='transform .5s cubic-bezier(.3,1.2,.5,1)';
  view.s=s; view.tx=r.width/2-(minX+maxX)/2*s; view.ty=top+(r.height-top-bottom)/2-(minY+maxY)/2*s; apply();
  setTimeout(()=>layer.style.transition='',520);
}

const pick={w:10, cats:new Set(), last:null, spinning:false};
function pickPool(){return DATA.filter(d=>d.min<=pick.w && (!pick.cats.size||pick.cats.has(d.cat)));}
function renderPick(){
  $('#pickChips').innerHTML=CATS.filter(c=>c.k!=='all').map(c=>`<button class="chip" data-k="${c.k}" aria-pressed="${pick.cats.has(c.k)}" style="--chipOn:${c.c}"><span class="e">${c.e}</span>${c.name}</button>`).join('');
  $('#pickChips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k; pick.cats.has(k)?pick.cats.delete(k):pick.cats.add(k); renderPick();});
  document.querySelectorAll('#walkSeg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===pick.w));
  const n=pickPool().length;
  $('#pickCount').textContent=n?`조건에 맞는 맛집 ${n}곳 중에서 골라요`:'조건에 맞는 맛집이 없어요. 걷는 시간을 늘리거나 메뉴를 바꿔보세요.';
  $('#spinBtn').disabled=!n||pick.spinning;

document.querySelectorAll('#walkSeg button').forEach(b=>b.onclick=()=>{pick.w=+b.dataset.w; renderPick();});
function showPick(d,final){
  const c=catOf(d); $('#slot').style.setProperty('--sc',c.c);
  $('#sFace').textContent=c.e; $('#sCat').textContent=`${c.name} · 🚶 (회사 기준 도보) ${d.min}분 · 🚇 ${d.exit}번 출구에서 ${d.exitM}m`; $('#sName').textContent=d.name;

}
$('#spinBtn').onclick=()=>{
  const pool=pickPool(); if(!pool.length||pick.spinning) return;
  pick.spinning=true; renderPick(); $('#sActions').hidden=true;
  const slot=$('#slot'); slot.classList.remove('done'); slot.classList.add('spin');
  $('#sBody').className='hint'; $('#sBody').textContent='두구두구두구…';
  let choice; do{choice=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&choice===pick.last);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i=0, steps=reduce?1:18;
  const tick=()=>{ i++;
    if(i<steps){ showPick(pool[Math.floor(Math.random()*pool.length)],false); setTimeout(tick,50+i*i*1.2); }
    else { pick.last=choice; showPick(choice,true); slot.classList.remove('spin'); void slot.offsetWidth; slot.classList.add('done');
      $('#sActions').hidden=false; $('#sMap').href=kakaoWalk(choice); $('#spinBtn').textContent='다시 돌리기'; pick.spinning=false; renderPick(); } };
  tick();
};

const meet={db:null,user:null,uid:null,canWrite:null,canAdmin:false,ready:false,started:false,signups:[],rounds:{},profiles:{},err:'',busy:false,prefs:new Set(),team:''};
const DOW='일월화수목금토';
function nextFriday(){const d=new Date(); let add=(5-d.getDay()+7)%7; if(add===0) add=7; d.setDate(d.getDate()+add); return d;}
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function currentRound(){ return meet.rounds.current?.date || ymd(nextFriday()); }
function renderHero(){
  const r=currentRound(); const d=new Date(r+'T12:00:00');
  $('#calM').textContent=(d.getMonth()+1)+'월'; $('#calD').textContent=d.getDate(); $('#calW').textContent=DOW[d.getDay()]+'요일';
  $('#whenT').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]}) 런치밋`;
  const list=meet.signups.filter(s=>s.round===r); const teams=new Set(list.map(s=>s.team));
  $('#stN').textContent=list.length; $('#stT').textContent=teams.size; $('#stG').textContent=list.length>=2?Math.max(1,Math.round(list.length/4))+'개':'-';

async function meetInit(){
  renderHero(); renderMeet();
  if(meet.started) return; meet.started=true;
  if(!window.claude?.use){ meet.ready=true; meet.err='offline'; renderMeet(); return; }
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    meet.db=db; meet.user=user;
    if(user){ meet.uid=await user.id(); meet.canWrite=await user.can('data.write'); meet.canAdmin=await user.canEdit(); }
    if(!db){ meet.ready=true; meet.err='offline'; renderMeet(); return; }
    db.collection('lunchmeet').onSnapshot(s=>{ meet.signups=s.docs.map(d=>({id:d.id,...d.data()})); meet.ready=true; renderHero(); renderMeet(); },
      e=>{ meet.err='load'; renderMeet(); });
    db.collection('rounds').onSnapshot(s=>{ meet.rounds=Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); renderHero(); renderMeet(); }, ()=>{});
  }catch(e){ meet.ready=true; meet.err='offline'; renderMeet(); }
}
async function resolveNames(ids){ if(!meet.user||!ids.length) return {}; try{ return await meet.user.profiles(ids); }catch(e){ return {}; } }
function personHTML(uid,team,ps){ const p=ps[uid]||{}; const nm=p.name||(uid===meet.uid?'나':'동료');
  return `<span class="person">${p.avatarUrl?`<img src="${esc(p.avatarUrl)}" alt="">`:''}<span class="nm">${esc(nm)}${uid===meet.uid?' (나)':''}</span><span class="tm">${esc(team)}</span></span>`; }
let renderSeq=0;
async function renderMeet(){
  const seq=++renderSeq; const box=$('#meetBody');
  if(!meet.ready){ box.innerHTML=`<div class="box"><div class="msg">신청 현황을 불러오는 중이에요…</div></div>`; return; }
  if(meet.err==='offline'){ box.innerHTML=`<div class="notice">런치밋 신청은 슬랙에서 할 수 있어요. 아무 채널이나 DM 창에 <b>/lunchmeet</b> 을 입력해 신청하고, 조 편성 결과도 슬랙으로 받아보세요.</div>`; return; }
  const r=currentRound(); const list=meet.signups.filter(s=>s.round===r);
  const mine=list.find(s=>s.id===meet.uid); const res=meet.rounds['r-'+r];
  const ps=await resolveNames([...new Set([...list.map(s=>s.id), ...(res?res.groups.flatMap(g=>g.members):[])])]);
  if(seq!==renderSeq) return;
  const knownTeams=[...new Set(meet.signups.map(s=>s.team).filter(Boolean))].slice(0,12);
  let h='';
  // result
  if(res){
    const myIdx=res.groups.findIndex(g=>g.members.includes(meet.uid));
    h+=`<div class="box"><div class="lbl">🎉 매칭 결과 <small>${res.groups.length}개 조</small></div>`+
      res.groups.map((g,i)=>{const p=BYID[g.place]; const c=p?catOf(p):null; const teamOf=id=>(list.find(s=>s.id===id)||{}).team||'';
        return `<div class="group${i===myIdx?' mine':''}"><div class="ghead"><span class="gno">${i+1}조</span>${i===myIdx?'<span class="gmine">우리 조</span>':''}</div>
        <div class="people">${g.members.map(id=>personHTML(id,teamOf(id),ps)).join('')}</div>
        ${p?`<button class="gplace" data-place="${p.id}"><span class="cico" style="background:color-mix(in srgb,${c.c} 18%,transparent)">${c.e}</span><span style="flex:1;min-width:0"><span class="nm">${esc(p.name)}</span><br><span class="mn">${esc(p.menu)} · 🚶 ${p.min}분</span></span><span class="walk">지도 ›</span></button>`:''}</div>`}).join('')+`</div>`;
  }
  // my status
  if(!meet.uid){
    h+=`<div class="notice">로그인 정보가 확인되지 않아 신청할 수 없어요. claude.ai에 로그인한 상태로 열어주세요.</div>`;
  } else if(mine){
    h+=`<div class="box"><div class="joined"><div class="badge">🙌</div><div style="flex:1;min-width:0"><div class="t">신청 완료!</div><div class="s">${esc(mine.team)}${mine.prefs?.length?' · 선호 '+mine.prefs.map(k=>CAT[k]?.name||k).join(', '):''}</div></div>
      ${res?'':'<button class="linkBtn" id="cancelBtn">신청 취소</button>'}</div>
      <div class="msg">${res?'조 편성이 끝났어요. 위에서 우리 조를 확인하세요.':'조 편성이 끝나면 이 화면에 우리 조와 식당이 표시돼요.'}</div></div>`;
  } else if(res){
    h+=`<div class="notice">이번 회차는 조 편성이 끝났어요. 다음 회차에 신청해 주세요!</div>`;
  } else if(meet.canWrite===false){
    h+=`<div class="notice">지금 권한으로는 신청할 수 없어요. 페이지 주인에게 '참여자' 권한을 요청해 주세요.</div>`;
  } else {
    h+=`<div class="box">
      <div class="field"><label class="lbl" for="teamIn">👥 소속 팀</label><input id="teamIn" maxlength="20" placeholder="예: 인사팀" value="${esc(meet.team)}" autocomplete="off">
      ${knownTeams.length?`<div class="teams">${knownTeams.map(t=>`<button data-team="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}</div>
      <div class="lbl">😋 이런 메뉴면 좋겠어요 <small>선택 · 최대 3개</small></div>
      <div class="chips wrap" id="prefChips">${CATS.filter(c=>c.k!=='all'&&c.k!=='카페'&&c.k!=='저녁회식장소추천').map(c=>`<button class="chip" data-k="${c.k}" aria-pressed="${meet.prefs.has(c.k)}" style="--chipOn:${c.c}"><span class="e">${c.e}</span>${c.name}</button>`).join('')}</div>
      <button class="joinBtn" id="joinBtn" ${meet.busy?'disabled':''}>참여 신청하기</button>
      <div class="msg${meet.err==='write'?' err':''}" id="joinMsg">${meet.err==='write'?'신청을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.':'같은 팀끼리는 되도록 다른 조로 나눠져요.'}</div></div>`;
  }
  // participants
  h+=`<div class="box"><div class="lbl">🙋 신청한 동료 <small>${list.length}명</small></div>`+
     (list.length?`<div class="people">${list.map(s=>personHTML(s.id,s.team,ps)).join('')}</div>`:`<div class="msg">아직 신청한 사람이 없어요. 첫 번째로 신청해 보세요!</div>`)+`</div>`;
  // admin
  if(meet.canAdmin){
    h+=`<div class="admin"><div class="lbl">🛠️ 운영자 메뉴 <small>편집 권한이 있는 사람에게만 보여요</small></div>
      <div class="arow"><input type="date" id="roundIn" value="${r}" aria-label="회차 날짜"><button class="abtn soft" id="roundBtn">회차 날짜 저장</button></div>
      <div class="arow">${res?`<button class="abtn" id="matchBtn">다시 섞기</button><button class="abtn warn" id="clearBtn">결과 지우기</button>`:`<button class="abtn" id="matchBtn" ${list.length<2?'disabled':''}>조 편성하기 (${list.length}명)</button>`}</div>
      <div class="msg" id="adminMsg">${list.length<2?'2명 이상 신청하면 조를 편성할 수 있어요.':'다른 팀끼리 섞이도록 3~4명씩 나누고, 조원 선호 메뉴에 맞춰 걸어서 10분 이내 식당을 골라요.'}</div></div>`;
  }
  box.innerHTML=h;
  // wire
  box.querySelectorAll('.gplace').forEach(b=>b.onclick=()=>showOnMap(+b.dataset.place));
  const ti=$('#teamIn'); if(ti) ti.oninput=e=>{meet.team=e.target.value};
  box.querySelectorAll('.teams button').forEach(b=>b.onclick=()=>{meet.team=b.dataset.team; ti.value=meet.team;});
  box.querySelectorAll('#prefChips .chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k; if(meet.prefs.has(k)) meet.prefs.delete(k); else if(meet.prefs.size<3) meet.prefs.add(k); b.setAttribute('aria-pressed',meet.prefs.has(k)); box.querySelectorAll('#prefChips .chip').forEach(x=>x.setAttribute('aria-pressed',meet.prefs.has(x.dataset.k)));});
  $('#joinBtn')&&($('#joinBtn').onclick=join);
  $('#cancelBtn')&&($('#cancelBtn').onclick=cancel);
  $('#roundBtn')&&($('#roundBtn').onclick=saveRound);
  $('#matchBtn')&&($('#matchBtn').onclick=runMatch);
  $('#clearBtn')&&($('#clearBtn').onclick=clearMatch);
}
async function join(){
  const team=(meet.team||'').trim(); if(!team){ $('#joinMsg').textContent='소속 팀을 적어주세요.'; $('#joinMsg').className='msg err'; $('#teamIn').focus(); return; }
  meet.busy=true; meet.err=''; renderMeet();
  try{ await meet.db.doc('lunchmeet/'+meet.uid).set({round:currentRound(),team,prefs:[...meet.prefs],at:new Date().toISOString()}); }
  catch(e){ meet.err='write'; if(e?.code==='invalid_argument') meet.canWrite=false; }
  meet.busy=false; renderMeet();
}
async function cancel(){ try{ await meet.db.doc('lunchmeet/'+meet.uid).delete(); }catch(e){} }
function adminMsg(t,err){const m=$('#adminMsg'); if(m){m.textContent=t; m.className='msg'+(err?' err':'');}}
async function saveRound(){ const v=$('#roundIn').value; if(!v) return;
  try{ await meet.db.doc('rounds/current').set({date:v}); adminMsg('회차 날짜를 저장했어요.'); }catch(e){ adminMsg('저장하지 못했어요. 편집 권한을 확인해 주세요.',true); } }
function shuffle(a){a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function makeGroups(list){
  const n=list.length, g=Math.max(1,Math.round(n/4));
  const byTeam={}; shuffle(list).forEach(s=>(byTeam[s.team]??=[]).push(s));
  const order=Object.values(byTeam).sort((a,b)=>b.length-a.length).flat();
  const groups=Array.from({length:g},()=>[]);
  order.forEach((s,i)=>groups[i%g].push(s));
  const used=new Set();
  return groups.map(m=>{ const prefs=new Set(m.flatMap(s=>s.prefs||[]));
    let pool=DATA.filter(d=>d.min<=10 && d.cat!=='카페' && d.cat!=='저녁회식장소추천' && !used.has(d.id));
    const pref=pool.filter(d=>prefs.has(d.cat)); if(pref.length) pool=pref;
    const p=pool[Math.floor(Math.random()*pool.length)]; if(p) used.add(p.id);
    return {members:m.map(s=>s.id), place:p?p.id:null}; });
}
async function runMatch(){
  const r=currentRound(); const list=meet.signups.filter(s=>s.round===r); if(list.length<2) return;
  try{ await meet.db.doc('rounds/r-'+r).set({date:r,groups:makeGroups(list),at:new Date().toISOString()}); adminMsg('조 편성을 마쳤어요.'); }
  catch(e){ adminMsg('저장하지 못했어요. 편집 권한을 확인해 주세요.',true); }
}
let clearArm=false;
async function clearMatch(){
  const b=$('#clearBtn'); if(!clearArm){ clearArm=true; b.textContent='한 번 더 누르면 지워져요'; setTimeout(()=>{clearArm=false; if(b.isConnected) b.textContent='결과 지우기';},3000); return; }
  clearArm=false; try{ await meet.db.doc('rounds/r-'+currentRound()).delete(); adminMsg('결과를 지웠어요.'); }catch(e){ adminMsg('지우지 못했어요.',true); }
}

drawRoads(); buildPins(); renderChips(); refreshMap(); renderPick(); centerOn(0,0,1.25);

setTab('map'); centerOn(0,0,1.25);
requestAnimationFrame(()=>centerOn(0,0,1.25));
addEventListener('load',()=>{ if(routeId==null && state.sel==null) centerOn(0,0,1.25); });
addEventListener('resize',placeFab);
